name: Capture Page HTML

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: "Public test-page URL (LinkedIn URLs are not supported)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-playwright.txt
          python -m playwright install --with-deps chromium
      - name: Capture rendered HTML
        env:
          PAGE_URL: ${{ inputs.page_url }}
        run: python -m app.ci_page_capture "$PAGE_URL"
      - name: Upload capture files
        uses: actions/upload-artifact@v4
        with:
          name: page-html-capture
          path: capture_output/
          retention-days: 3
