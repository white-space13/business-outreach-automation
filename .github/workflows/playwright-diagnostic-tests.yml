name: Playwright Diagnostic Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "app/browser_diagnostic.py"
      - "tests/test_browser_diagnostic.py"
      - "requirements-playwright.txt"
      - ".github/workflows/playwright-diagnostic-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-playwright.txt
      - name: Run diagnostic tests
        run: pytest -q tests/test_browser_diagnostic.py
